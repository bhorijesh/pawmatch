{% extends 'adoption/base.html' %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="container page">
    <div class="form-card">
        <h1 style="text-align:center;font-weight:800;margin-bottom:1.5rem;">Create Account</h1>
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p style="color:var(--coral);font-size:0.875rem;">{{ field.errors.0 }}</p>{% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary" style="width:100%;">Register</button>
        </form>
        <p style="text-align:center;margin-top:1rem;color:var(--text-muted);">
            Already have an account? <a href="{% url 'login' %}">Log in</a>
        </p>
    </div>
</div>
<style>.form-card input, .form-card input[type=checkbox] { font-family:inherit; } .form-card input:not([type=checkbox]) { width:100%; padding:0.75rem 1rem; border:2px solid var(--border); border-radius:var(--radius-sm); }</style>
{% endblock %}
