{% extends 'adoption/base.html' %}
{% block title %}Delete Pet{% endblock %}
{% block content %}
<div class="container page">
    <div class="form-card" style="text-align:center;">
        <h1 style="font-weight:800;margin-bottom:1rem;">Delete {{ object.name }}?</h1>
        <p style="color:var(--text-muted);margin-bottom:1.5rem;">This action cannot be undone.</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary" style="background:var(--coral);">Yes, Delete</button>
            <a href="{% url 'shelter_pets' %}" class="btn btn-outline">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
