{% extends 'adoption/base.html' %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="container page">
    <div class="form-card">
        <h1 style="font-weight:800;margin-bottom:1.5rem;text-align:center;">Change Password</h1>
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p style="color:var(--coral);font-size:0.875rem;">{{ field.errors.0 }}</p>{% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary" style="width:100%;">Update Password</button>
        </form>
    </div>
</div>
<style>.form-card input { width:100%; padding:0.75rem 1rem; border:2px solid var(--border); border-radius:var(--radius-sm); font-family:inherit; }</style>
{% endblock %}
